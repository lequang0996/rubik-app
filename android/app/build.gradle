apply plugin: 'com.android.application'

// ---- Ký bản release: đọc từ biến môi trường (GitHub Actions) hoặc gradle.properties / -P ----
def secret = { String name -> System.getenv(name) ?: (project.findProperty(name) ?: null) }
def keystorePath = secret('KEYSTORE_FILE')
def appVersionCode = (secret('VERSION_CODE') ?: '1').toString().toInteger()
def appVersionName = (secret('VERSION_NAME') ?: '1.0').toString()

// ---- AdMob: mặc định dùng ID THỬ NGHIỆM của Google (an toàn để bấm thử). Bản thật: đặt biến môi trường / -P cùng tên ----
def admobAppId      = secret('ADMOB_APP_ID')      ?: 'ca-app-pub-3940256099942544~3347511713'
def admobBannerId   = secret('ADMOB_BANNER_ID')   ?: 'ca-app-pub-3940256099942544/9214589741'
def admobAppOpenId  = secret('ADMOB_APPOPEN_ID')  ?: 'ca-app-pub-3940256099942544/9257395921'
def admobRewardedId = secret('ADMOB_REWARDED_ID') ?: 'ca-app-pub-3940256099942544/5224354917'

android {
    namespace = "com.tenban.cubeallinone"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId "com.tenban.cubeallinone"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        manifestPlaceholders = [admobAppId: admobAppId]
        buildConfigField "String", "ADMOB_BANNER_ID",   "\"${admobBannerId}\""
        buildConfigField "String", "ADMOB_APPOPEN_ID",  "\"${admobAppOpenId}\""
        buildConfigField "String", "ADMOB_REWARDED_ID", "\"${admobRewardedId}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // Keystore debug CỐ ĐỊNH (không bí mật) để mọi bản build debug trên GitHub Actions cùng chữ ký → cài đè được, KHÔNG mất exp/dữ liệu.
        // Nếu không cố định, mỗi lần CI chạy sinh khoá debug mới → Android bắt gỡ app cũ → mất hết dữ liệu (về Lv 1).
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword secret('KEYSTORE_PASSWORD')
                keyAlias secret('KEY_ALIAS')
                keyPassword secret('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (keystorePath) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "com.google.android.play:app-update:$playAppUpdateVersion"   // In-App Updates (Flexible)
    implementation "com.google.android.gms:play-services-ads:$playServicesAdsVersion"   // Google AdMob (banner / app open / rewarded)
    implementation "com.android.billingclient:billing:$playBillingVersion"   // Google Play Billing (gói tháng + mua lẻ)
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
