name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test-engine:
    name: Kiểm thử engine (đối chiếu bản Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Build APK / AAB
    needs: test-engine
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Đồng bộ web → Android
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK (runner ubuntu-latest đã cài sẵn) – chấp nhận license, cài platform 36
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Dùng $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" || true
      - uses: gradle/actions/setup-gradle@v4

      - name: Cấp quyền chạy cho gradlew (Git trên Windows làm mất quyền này)
        run: chmod +x android/gradlew

      - name: Build APK debug (cài thử lên điện thoại)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: cube-all-in-one-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Giải mã keystore upload
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build AAB release (đã ký) để đăng Google Play
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ vars.VERSION_NAME || '1.0' }}
        run: ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: cube-all-in-one-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
